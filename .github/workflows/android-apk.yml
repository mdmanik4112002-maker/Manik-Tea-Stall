name: Build My Inventory APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project
        run: |
          mkdir project
          unzip MyInventory_Android_Starter.zip -d project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: My-Inventory-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
